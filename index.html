<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雪泥鸿爪 · 苏东坡生平互动卷</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #3e2e1f;
      background-image: radial-gradient(circle at 20% 30%, #5a4a35 0%, #2b1f12 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'KaiTi', '楷体', 'STKaiti', '华文楷体', 'Noto Serif SC', serif;
      padding: 20px;
    }

    /* ---------- 线装书主体（桌面端：左右页） ---------- */
    .book-wrapper {
      position: relative;
      width: 1200px;
      max-width: 98vw;
      height: 750px;
      max-height: 90vh;
      background: #e8dccc;
      border-radius: 4px 12px 12px 4px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6),
        inset -2px 0 8px rgba(0, 0, 0, 0.1),
        inset 2px 0 8px rgba(255, 255, 240, 0.5);
      display: flex;
      padding: 12px 8px 12px 24px;
      background-image: repeating-linear-gradient(45deg, rgba(180, 150, 120, 0.1) 0px, rgba(180, 150, 120, 0.1) 2px, transparent 2px, transparent 6px);
      border-left: 14px solid #6b4f35;
      border-right: 6px solid #4a3724;
      transition: all 0.3s;
    }

    .book-wrapper::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 16px;
      background: linear-gradient(90deg, #4a3724 0%, #7a5f44 40%, #4a3724 100%);
      border-radius: 4px 0 0 4px;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.3);
    }

    .page-left, .page-right {
      flex: 1;
      position: relative;
      background: #faf3e8;
      background-image: 
        linear-gradient(rgba(200, 180, 150, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 180, 150, 0.1) 1px, transparent 1px);
      background-size: 30px 30px, 30px 30px;
      box-shadow: inset 0 0 30px rgba(180, 150, 120, 0.3);
      overflow: hidden;
    }

    .page-left {
      border-radius: 8px 0 0 8px;
      margin-right: 4px;
      box-shadow: inset -4px 0 12px rgba(100, 70, 40, 0.15);
    }

    .page-right {
      border-radius: 0 8px 8px 0;
      margin-left: 4px;
      box-shadow: inset 4px 0 12px rgba(100, 70, 40, 0.15);
      display: flex;
      flex-direction: column;
      padding: 30px 30px 0 30px; /* 底部 padding 移除，由内部容器控制 */
      overflow: hidden;
    }

    /* 右页内部可滚动内容区 */
    .story-scroll {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: #b8a58b #f0e6d8;
    }
    .story-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .story-scroll::-webkit-scrollbar-thumb {
      background: #b8a58b;
      border-radius: 10px;
    }

    /* ---------- 地图容器 ---------- */
    #mapContainer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #mapCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      transition: opacity 0.4s ease;
    }

    #mapCanvas.macro-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #microCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      cursor: crosshair;
    }

    #microCanvas.show {
      display: block;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ---------- 返回按钮 ---------- */
    .back-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 9999;
      background: rgba(232, 220, 204, 0.95);
      border: 2px solid #b8a58b;
      border-radius: 40px;
      padding: 8px 20px;
      font-size: 15px;
      color: #5a3e2b;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      font-family: 'KaiTi', serif;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }

    .back-btn:hover {
      background: #dacbb8;
      transform: scale(1.05);
    }

    .back-btn.show {
      display: flex;
    }

    .level-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 100;
      background: rgba(232, 220, 204, 0.85);
      border: 1px solid #c9ad8c;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      color: #8b6f4c;
      letter-spacing: 2px;
      font-family: 'KaiTi', serif;
      backdrop-filter: blur(4px);
    }

    /* ---------- 站点印章 ---------- */
    .station-marker {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 20;
      transition: all 0.25s ease;
      filter: drop-shadow(2px 4px 6px rgba(60, 30, 10, 0.4));
    }

    .station-marker:hover {
      transform: translate(-50%, -50%) scale(1.2);
      filter: drop-shadow(2px 6px 10px rgba(120, 40, 10, 0.6));
    }

    .station-marker .seal {
      width: 100%;
      height: 100%;
      background: #b34a3a;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6c8;
      font-size: 14px;
      font-weight: bold;
      font-family: 'STKaiti', 'KaiTi', serif;
      border: 2px dashed #d9b382;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
      text-align: center;
      line-height: 1.1;
      padding: 3px;
      word-break: break-all;
      transition: all 0.3s;
    }

    .station-marker.active .seal {
      background: #8b2f1f;
      box-shadow: 0 0 0 4px rgba(200, 120, 60, 0.5), inset 0 0 12px #ffd966;
      border-color: #ffd966;
    }

    .spot-marker {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 25;
      transition: all 0.25s ease;
      filter: drop-shadow(1px 3px 4px rgba(60, 30, 10, 0.4));
    }

    .spot-marker:hover {
      transform: translate(-50%, -50%) scale(1.25);
    }

    .spot-marker .spot-seal {
      width: 100%;
      height: 100%;
      background: #2b6b4a;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6c8;
      font-size: 11px;
      font-weight: bold;
      font-family: 'STKaiti', 'KaiTi', serif;
      border: 2px dotted #b8d8c8;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
      text-align: center;
      line-height: 1.1;
      padding: 2px;
      word-break: break-all;
    }

    .spot-marker.active .spot-seal {
      background: #1a4d33;
      box-shadow: 0 0 0 4px rgba(100, 200, 140, 0.5), inset 0 0 10px #b8ffd8;
      border-color: #b8ffd8;
    }

    /* ---------- 右页内容排版 ---------- */
    .story-header {
      font-family: 'STKaiti', 'KaiTi', '楷体', cursive;
      font-size: 26px;
      color: #5a3e2b;
      border-bottom: 2px dashed #c9ad8c;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      letter-spacing: 3px;
      flex-shrink: 0;
    }

    .story-header .date-tag {
      font-size: 15px;
      color: #8b6f4c;
      letter-spacing: 0;
      font-family: 'KaiTi', serif;
      background: #ede0d0;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #c9ad8c;
    }

    .story-title {
      font-size: 28px;
      color: #3e2a1a;
      margin: 10px 0 8px 0;
      font-family: 'STKaiti', 'KaiTi', cursive;
      text-shadow: 1px 1px 0 rgba(200, 170, 140, 0.3);
    }

    .story-sub {
      font-size: 16px;
      color: #8b6f4c;
      margin-bottom: 20px;
      font-style: italic;
      border-left: 4px solid #b34a3a;
      padding: 8px 0 8px 16px;
      background: rgba(200, 170, 140, 0.1);
    }

    .poem-box {
      background: #f3eadc;
      border-left: 6px solid #b34a3a;
      padding: 18px 18px 14px 22px;
      margin: 16px 0 20px 0;
      border-radius: 0 20px 20px 0;
      box-shadow: 4px 4px 0 rgba(160, 120, 90, 0.15);
      position: relative;
    }

    .poem-box::before {
      content: '❝';
      font-size: 40px;
      color: #c9ad8c;
      position: absolute;
      top: -6px;
      left: 8px;
      opacity: 0.5;
      font-family: serif;
    }

    .poem-text {
      font-family: 'STKaiti', 'KaiTi', cursive;
      font-size: 19px;
      line-height: 1.7;
      color: #2b1f12;
      white-space: pre-line;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .poem-source {
      text-align: right;
      font-size: 13px;
      color: #8b6f4c;
      margin-top: 10px;
      font-style: italic;
    }

    .story-text {
      font-size: 17px;
      line-height: 1.85;
      color: #3e2e1f;
      text-align: justify;
      text-indent: 2em;
    }

    .story-text p {
      margin-bottom: 12px;
    }

    /* ---------- 时间轴（固定在右页底部，不遮挡文字） ---------- */
    .timeline-container {
      flex-shrink: 0;
      background: rgba(230, 215, 195, 0.95);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(60, 40, 20, 0.3);
      border: 1px solid #b8a58b;
      z-index: 50;
      margin: 8px 0 16px 0;
    }

    .timeline-container label {
      font-size: 14px;
      color: #5a3e2b;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #timeSlider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #b8a58b;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    #timeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #b34a3a;
      border-radius: 50%;
      border: 2px solid #f5e6c8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .age-display {
      font-size: 17px;
      color: #b34a3a;
      font-weight: bold;
      min-width: 58px;
      text-align: center;
      font-family: 'KaiTi', serif;
      background: #f5e6c8;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid #c9ad8c;
    }

    .audio-toggle {
      position: absolute;
      top: 12px;
      right: 20px;
      z-index: 60;
      background: #e8dccc;
      border: 2px solid #b8a58b;
      border-radius: 40px;
      padding: 6px 14px;
      font-size: 14px;
      color: #5a3e2b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: all 0.2s;
      font-family: 'KaiTi', serif;
    }

    .audio-toggle:hover {
      background: #dacbb8;
    }

    .audio-toggle.active {
      background: #b34a3a;
      color: #f5e6c8;
      border-color: #8b2f1f;
    }

    /* 动画 */
    @keyframes scrollOpen {
      0% { transform: scaleX(0.85) scaleY(0.92); opacity: 0.4; }
      100% { transform: scaleX(1) scaleY(1); opacity: 1; }
    }

    .story-scroll.animate {
      animation: scrollOpen 0.4s ease-out;
    }

    @keyframes inkSpread {
      0% { box-shadow: inset 0 0 0 0 rgba(180, 70, 40, 0.6); }
      100% { box-shadow: inset 0 0 40px 20px rgba(180, 70, 40, 0); }
    }

    .ink-flash {
      animation: inkSpread 0.6s ease-out;
    }

    /* ---------- 手机端：上下页模式，固定宽高比不变形 ---------- */
    @media (max-width: 800px) {
      body {
        padding: 0;
        background: #2b1f12;
        align-items: flex-start;
        min-height: 100vh;
      }

      .book-wrapper {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        max-height: 100vh;
        flex-direction: column;
        padding: 0;
        border-left: none;
        border-right: none;
        border-radius: 0;
        background: #e8dccc;
        box-shadow: none;
      }

      .book-wrapper::before {
        display: none;
      }

      /* 左页（地图）：占据上半部分，固定比例 16:9 不变形 */
      .page-left {
        flex: none;
        width: 100vw;
        height: 56.25vw;       /* 16:9 比例，随宽度自适应 */
        max-height: 45vh;      /* 限制最大高度，避免地图过高 */
        margin: 0;
        border-radius: 0;
        box-shadow: inset 0 -4px 12px rgba(100, 70, 40, 0.15);
        flex-shrink: 0;
      }

      /* 右页（文字）：占据剩余空间 */
      .page-right {
        flex: 1;
        margin: 0;
        border-radius: 0;
        padding: 16px 16px 0 16px;
        box-shadow: inset 0 4px 12px rgba(100, 70, 40, 0.15);
        overflow: hidden;
      }

      .story-header {
        font-size: 20px;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }

      .story-header .date-tag {
        font-size: 13px;
        padding: 3px 10px;
      }

      .story-title {
        font-size: 22px;
      }

      .story-sub {
        font-size: 14px;
        padding: 6px 0 6px 12px;
      }

      .poem-text {
        font-size: 16px;
        letter-spacing: 1px;
      }

      .story-text {
        font-size: 15px;
        line-height: 1.75;
      }

      /* 时间轴在手机端位于右页底部，不遮挡文字 */
      .timeline-container {
        padding: 8px 14px;
        gap: 10px;
        margin: 6px 0 10px 0;
      }

      .timeline-container label {
        font-size: 12px;
      }

      #timeSlider {
        height: 5px;
      }

      #timeSlider::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
      }

      .age-display {
        font-size: 14px;
        min-width: 48px;
        padding: 1px 8px;
      }

      .audio-toggle {
        top: 8px;
        right: 12px;
        padding: 4px 10px;
        font-size: 12px;
      }

      .back-btn {
        top: 12px;
        left: 12px;
        padding: 6px 14px;
        font-size: 13px;
      }

      .level-indicator {
        top: 8px;
        right: 8px;
        font-size: 10px;
        padding: 3px 10px;
      }

      .station-marker {
        width: 36px;
        height: 36px;
      }

      .station-marker .seal {
        font-size: 11px;
      }

      .spot-marker {
        width: 30px;
        height: 30px;
      }

      .spot-marker .spot-seal {
        font-size: 9px;
      }
    }

    /* 极小屏幕（宽度 < 400px）进一步适配 */
    @media (max-width: 400px) {
      .page-left {
        height: 56.25vw;
        max-height: 40vh;
      }

      .story-title {
        font-size: 19px;
      }

      .poem-text {
        font-size: 14px;
      }

      .story-text {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <button class="audio-toggle" id="audioToggle">🌧️ 雨声 · 关</button>

  <div class="book-wrapper" id="bookWrapper">
    <div class="page-left">
      <div id="mapContainer">
        <canvas id="mapCanvas"></canvas>
        <canvas id="microCanvas"></canvas>
      </div>
    </div>

    <div class="page-right" id="storyPanel">
      <!-- 内部滚动区：故事内容 -->
      <div class="story-scroll" id="storyScroll">
        <div class="story-header">
          <span id="headerPlace">眉山</span>
          <span class="date-tag" id="headerDate">1036年</span>
        </div>
        <div class="story-title" id="storyTitle">眉山 · 少年意气</div>
        <div class="story-sub" id="storySub">人生到处知何似，应似飞鸿踏雪泥</div>

        <div class="poem-box" id="poemBox">
          <div class="poem-text" id="poemText">人生到处知何似，应似飞鸿踏雪泥。
泥上偶然留指爪，鸿飞那复计东西。</div>
          <div class="poem-source" id="poemSource">—— 苏轼《和子由渑池怀旧》</div>
        </div>

        <div class="story-text" id="storyText">
          <p>宋仁宗景祐三年（1036年），苏轼生于眉州眉山。父亲苏洵，弟弟苏辙，父子三人皆以文章名世，世称“三苏”。少年苏轼在母亲程氏教导下读书，十岁便能写出奇绝之句，二十岁前已“学通经史，属文日数千言”。</p>
          <p>眉山的三苏祠，至今仍存“三分水，二分竹”的岛居风貌。这里是苏轼人生画卷的起点——一个少年在此立下“奋厉有当世志”的宏愿，而后与父兄一同出蜀，奔赴汴京，走向他一生的风雨与旷达。</p>
        </div>
      </div>

      <!-- 时间轴：固定在右页底部，独立于滚动区之外 -->
      <div class="timeline-container">
        <label>人生轨迹</label>
        <input type="range" id="timeSlider" min="0" max="8" value="0" step="1">
        <span class="age-display" id="ageDisplay">20岁</span>
      </div>
    </div>
  </div>

        {
          id: 'bianjing', name: '汴京', sealText: '汴京', year: '1057年', age: 22,
          x: 0.48, y: 0.52,
          title: '汴京 · 名动京师', sub: '奋厉有当世志',

      function resizeCanvases() {
        const rect = mapContainer.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        [macroCanvas, microCanvas].forEach(c => {
          c.width = rect.width * dpr;
          c.height = rect.height * dpr;
          c.style.width = rect.width + 'px';
          c.style.height = rect.height + 'px';
        });
        macroCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        microCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawMacroMap() {
        const w = macroCanvas.width / (window.devicePixelRatio || 1);
        const h = macroCanvas.height / (window.devicePixelRatio || 1);
        macroCtx.clearRect(0, 0, w, h);

        macroCtx.fillStyle = '#f0e4d0';
        macroCtx.fillRect(0, 0, w, h);

        for (let i = 0; i < 200; i++) {
          macroCtx.fillStyle = `rgba(180, 150, 110, ${Math.random() * 0.06})`;
          macroCtx.beginPath();
          macroCtx.arc(Math.random() * w, Math.random() * h, Math.random() * 3 + 0.5, 0, Math.PI * 2);
          macroCtx.fill();
        }

        macroCtx.strokeStyle = 'rgba(140, 120, 90, 0.25)';
        macroCtx.lineWidth = 1.5;
        for (let k = 0; k < 6; k++) {
          macroCtx.beginPath();
          let startX = w * (0.08 + k * 0.15);
          let startY = h * 0.15;
          macroCtx.moveTo(startX, startY);
          for (let t = 0; t < 1; t += 0.05) {
            let x = startX + Math.sin(t * 8 + k) * 30 + t * 80;
            let y = startY + t * h * 0.7 + Math.cos(t * 6 + k) * 15;
            macroCtx.lineTo(x, y);
          }
          macroCtx.stroke();
        }

        macroCtx.beginPath();
        macroCtx.strokeStyle = 'rgba(100, 130, 160, 0.3)';
        macroCtx.lineWidth = 6;
        macroCtx.moveTo(w * 0.05, h * 0.5);
        macroCtx.bezierCurveTo(w * 0.3, h * 0.35, w * 0.5, h * 0.55, w * 0.75, h * 0.45);
        macroCtx.bezierCurveTo(w * 0.85, h * 0.4, w * 0.95, h * 0.48, w * 0.98, h * 0.5);
        macroCtx.stroke();

        macroCtx.beginPath();
        macroCtx.strokeStyle = 'rgba(160, 130, 80, 0.3)';
        macroCtx.lineWidth = 4;
        macroCtx.moveTo(w * 0.15, h * 0.3);
        macroCtx.bezierCurveTo(w * 0.25, h * 0.25, w * 0.4, h * 0.3, w * 0.5, h * 0.38);
        macroCtx.bezierCurveTo(w * 0.6, h * 0.45, w * 0.7, h * 0.42, w * 0.8, h * 0.45);
        macroCtx.stroke();

        if (revealedCount >= 2) {
          const points = [];
          for (let i = 0; i < revealedCount; i++) {
            const s = macroStations[i];
            points.push({ x: s.x * w, y: s.y * h });
          }
          if (points.length >= 2) {
            macroCtx.save();
            macroCtx.setLineDash([8, 10]);
            macroCtx.lineWidth = 3;
            macroCtx.strokeStyle = 'rgba(180, 70, 40, 0.7)';
            macroCtx.shadowColor = 'rgba(200, 120, 60, 0.5)';
            macroCtx.shadowBlur = 8;
            macroCtx.beginPath();
            macroCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              const prev = points[i - 1];
              const curr = points[i];
              const cp1x = prev.x + (curr.x - prev.x) * 0.3;
              const cp1y = prev.y - 20;
              const cp2x = prev.x + (curr.x - prev.x) * 0.7;
              const cp2y = curr.y + 20;
              macroCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, curr.x, curr.y);
            }
            macroCtx.stroke();
            macroCtx.restore();

            points.forEach((p, idx) => {
              if (idx === 0 || idx === revealedCount - 1) return;
              macroCtx.beginPath();
              macroCtx.fillStyle = '#b34a3a';
              macroCtx.shadowBlur = 12;
              macroCtx.shadowColor = 'rgba(180, 70, 40, 0.6)';
              macroCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
              macroCtx.fill();
              macroCtx.shadowBlur = 0;
            });
          }
        }
      }

      function drawMicroMap() {
        const w = microCanvas.width / (window.devicePixelRatio || 1);
        const h = microCanvas.height / (window.devicePixelRatio || 1);
        microCtx.clearRect(0, 0, w, h);

        microCtx.fillStyle = '#f0e4d0';
        microCtx.fillRect(0, 0, w, h);

        for (let i = 0; i < 150; i++) {
          microCtx.fillStyle = `rgba(200, 180, 150, ${Math.random() * 0.1})`;
          microCtx.beginPath();
          microCtx.ellipse(Math.random() * w, Math.random() * h, Math.random() * 20 + 5, Math.random() * 10 + 2, Math.random() * Math.PI, 0, Math.PI * 2);
          microCtx.fill();
        }

        const macro = macroStations[currentMacroIndex];
        microCtx.strokeStyle = 'rgba(120, 100, 70, 0.2)';
        microCtx.lineWidth = 1;

        if (macro.id === 'hangzhou') {
          microCtx.beginPath();
          microCtx.strokeStyle = 'rgba(100, 140, 180, 0.35)';
          microCtx.lineWidth = 8;
          microCtx.ellipse(w * 0.5, h * 0.52, w * 0.3, h * 0.25, 0, 0, Math.PI * 2);
          microCtx.stroke();
          microCtx.beginPath();
          microCtx.strokeStyle = 'rgba(80, 120, 80, 0.4)';
          microCtx.lineWidth = 6;
          microCtx.moveTo(w * 0.3, h * 0.65);
          microCtx.bezierCurveTo(w * 0.4, h * 0.55, w * 0.55, h * 0.5, w * 0.7, h * 0.45);
          microCtx.stroke();
        } else if (macro.id === 'huangzhou') {
          microCtx.beginPath();
          microCtx.strokeStyle = 'rgba(140, 100, 70, 0.4)';
          microCtx.lineWidth = 10;
          microCtx.moveTo(w * 0.2, h * 0.7);
          microCtx.bezierCurveTo(w * 0.3, h * 0.4, w * 0.5, h * 0.35, w * 0.7, h * 0.6);
          microCtx.stroke();
          microCtx.beginPath();
          microCtx.strokeStyle = 'rgba(100, 140, 180, 0.3)';
          microCtx.lineWidth = 12;
          microCtx.moveTo(w * 0.05, h * 0.55);
          microCtx.bezierCurveTo(w * 0.3, h * 0.5, w * 0.7, h * 0.6, w * 0.95, h * 0.55);
          microCtx.stroke();
        } else if (macro.id === 'meishan') {
          for (let i = 0; i < 20; i++) {
            microCtx.beginPath();
            microCtx.strokeStyle = 'rgba(80, 120, 60, 0.2)';
            microCtx.lineWidth = 3;
            let x = w * (0.1 + Math.random() * 0.8);
            let y = h * (0.2 + Math.random() * 0.7);
            microCtx.moveTo(x, y);
            microCtx.lineTo(x + Math.sin(i) * 15, y - 30 - Math.random() * 20);
            microCtx.stroke();
          }
        } else {
          for (let i = 0; i < 8; i++) {
            microCtx.beginPath();
            microCtx.strokeStyle = 'rgba(140, 120, 90, 0.15)';
            microCtx.lineWidth = 2;
            let y = h * (0.1 + i * 0.1);
            microCtx.moveTo(w * 0.1, y);
            microCtx.lineTo(w * 0.9, y + Math.sin(i) * 10);
            microCtx.stroke();
          }
        }
      }

      function createMacroMarkers() {
        document.querySelectorAll('.station-marker, .spot-marker').forEach(el => el.remove());
        macroStations.forEach((station, index) => {
          const marker = document.createElement('div');
          marker.className = 'station-marker';
          marker.dataset.index = index;
          marker.style.left = (station.x * 100) + '%';
          marker.style.top = (station.y * 100) + '%';
          marker.innerHTML = `<div class="seal">${station.sealText}</div>`;
          marker.addEventListener('click', (e) => {
            e.stopPropagation();
            if (index >= revealedCount) revealedCount = index + 1;
            enterMicroView(index);
          });
          mapContainer.appendChild(marker);
        });
        updateMacroMarkerStates();
      }

      function updateMacroMarkerStates() {
        document.querySelectorAll('.station-marker').forEach((el, i) => {
          const idx = parseInt(el.dataset.index);
          if (i < revealedCount) {
            el.style.opacity = '1';
          } else {
            el.style.opacity = '0.4';
          }
          if (idx === currentMacroIndex && mapLevel === 0) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
      }

      function enterMicroView(macroIndex) {
        currentMacroIndex = macroIndex;
        mapLevel = 1;
        currentSpotIndex = 0;
        revealedCount = Math.max(revealedCount, macroIndex + 1);

        timeSlider.value = macroIndex;
        ageDisplay.textContent = macroStations[macroIndex].age + '岁';

        macroCanvas.classList.add('macro-hidden');
        microCanvas.classList.add('show');

        resizeCanvases();
        drawMicroMap();

        document.querySelectorAll('.station-marker').forEach(el => el.remove());
        createMicroMarkers(macroIndex);

        showBackButton();
        updateLevelIndicator('城 · ' + macroStations[macroIndex].name);

        const spots = macroStations[macroIndex].spots;
        if (spots && spots.length > 0) {
          showSpotStory(macroIndex, 0);
        } else {
          showMacroStory(macroIndex);
        }
      }

      function backToMacro() {
        mapLevel = 0;

        microCanvas.classList.remove('show');
        macroCanvas.classList.remove('macro-hidden');

        resizeCanvases();
        drawMacroMap();

        document.querySelectorAll('.spot-marker').forEach(el => el.remove());
        hideBackButton();
        createMacroMarkers();
        showMacroStory(currentMacroIndex);
        updateLevelIndicator('国 · 大宋疆域');
        updateMacroMarkerStates();
      }

      function createMicroMarkers(macroIndex) {
        document.querySelectorAll('.spot-marker').forEach(el => el.remove());
        const spots = macroStations[macroIndex].spots || [];
        spots.forEach((spot, index) => {
          const marker = document.createElement('div');
          marker.className = 'spot-marker';
          marker.dataset.index = index;
          marker.style.left = (spot.x * 100) + '%';
          marker.style.top = (spot.y * 100) + '%';
          marker.innerHTML = `<div class="spot-seal">${spot.name}</div>`;
          marker.addEventListener('click', (e) => {
            e.stopPropagation();
            currentSpotIndex = index;
            showSpotStory(macroIndex, index);
            document.querySelectorAll('.spot-marker').forEach(m => m.classList.remove('active'));
            marker.classList.add('active');
          });
          mapContainer.appendChild(marker);
        });
        const firstSpot = document.querySelector('.spot-marker');
        if (firstSpot) firstSpot.classList.add('active');
      }

      function showMacroStory(index) {
        const s = macroStations[index];
        headerPlace.textContent = s.name;
        headerDate.textContent = s.year;
        storyTitle.textContent = s.title;
        storySub.textContent = s.sub;
        poemText.textContent = s.poem;
        poemSource.textContent = s.poemSource;
        storyText.innerHTML = s.story.split('\n\n').map(p => `<p>${p}</p>`).join('');
        storyScroll.scrollTo({ top: 0, behavior: 'smooth' });
        animateStoryPanel();
      }

      function showSpotStory(macroIndex, spotIndex) {
        const macro = macroStations[macroIndex];
        const spot = macro.spots[spotIndex];
        if (!spot) return;

        headerPlace.textContent = macro.name + ' · ' + spot.name;
        headerDate.textContent = macro.year;
        storyTitle.textContent = spot.name + ' · ' + macro.name;
        storySub.textContent = macro.sub;
        poemText.textContent = spot.poem || macro.poem;
        poemSource.textContent = spot.poemSource || macro.poemSource;
        storyText.innerHTML = `<p>${spot.story}</p><p>${macro.story.split('\n\n')[0]}</p>`;
        storyScroll.scrollTo({ top: 0, behavior: 'smooth' });
        animateStoryPanel();
      }

      function animateStoryPanel() {
        storyScroll.classList.remove('animate');
        void storyScroll.offsetWidth;
        storyScroll.classList.add('animate');
        storyScroll.classList.remove('ink-flash');
        void storyScroll.offsetWidth;
        storyScroll.classList.add('ink-flash');
      }

      function showBackButton() {
        if (!backBtn) {
          backBtn = document.createElement('button');
          backBtn.className = 'back-btn';
          backBtn.innerHTML = '← 返回全图';
          backBtn.addEventListener('click', backToMacro);
          document.body.appendChild(backBtn);
        }
        backBtn.classList.add('show');
      }

      function hideBackButton() {
        if (backBtn) backBtn.classList.remove('show');
      }

      function updateLevelIndicator(text) {
        if (!levelIndicator) {
          levelIndicator = document.createElement('div');
          levelIndicator.className = 'level-indicator';
          mapContainer.appendChild(levelIndicator);
        }
        levelIndicator.textContent = text;
      }

      timeSlider.addEventListener('input', (e) => {
        const idx = parseInt(e.target.value);
        revealedCount = idx + 1;
        currentMacroIndex = idx;
        if (mapLevel === 0) {
          updateMacroMarkerStates();
          drawMacroMap();
          showMacroStory(idx);
        } else {
          enterMicroView(idx);
        }
        ageDisplay.textContent = macroStations[idx].age + '岁';
      });

      function createRainSound() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          last = (last + 0.02 * white) / 1.02;
          data[i] = last * 3.5;
        }
        rainSource = audioCtx.createBufferSource();
        rainSource.buffer = buffer;
        rainSource.loop = true;
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.15;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        rainSource.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        rainSource.start(0);
      }

      audioToggle.addEventListener('click', () => {
        if (!audioCtx) {
          createRainSound();
          rainPlaying = true;
          audioToggle.classList.add('active');
          audioToggle.textContent = '🌧️ 雨声 · 开';
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return;
        }
        if (rainPlaying) {
          if (audioCtx.state === 'running') audioCtx.suspend();
          rainPlaying = false;
          audioToggle.classList.remove('active');
          audioToggle.textContent = '🌧️ 雨声 · 关';
        } else {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          rainPlaying = true;
          audioToggle.classList.add('active');
          audioToggle.textContent = '🌧️ 雨声 · 开';
        }
      });

      function init() {
        mapLevel = 0;
        currentMacroIndex = 0;
        revealedCount = 1;

        resizeCanvases();
        drawMacroMap();
        createMacroMarkers();
        showMacroStory(0);

        microCanvas.classList.remove('show');
        macroCanvas.classList.remove('macro-hidden');

        timeSlider.value = 0;
        ageDisplay.textContent = macroStations[0].age + '岁';
        updateLevelIndicator('国 · 大宋疆域');

        window.addEventListener('resize', () => {
          resizeCanvases();
          if (mapLevel === 0) {
            drawMacroMap();
          } else {
            drawMicroMap();
          }
        });
      }

      window.addEventListener('load', () => setTimeout(init, 60));
      if (document.readyState === 'complete') setTimeout(init, 60);
    })();
  </script>
</body>
</html>
